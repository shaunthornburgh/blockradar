; Replaces the default pool. No user/group directives: the container already
; runs as the unprivileged "app" user, and php-fpm rejects them when it is not
; started as root.
[www]

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Compose passes configuration through the environment, so it must survive.
clear_env = no

; Send worker output to the container log instead of a file.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Surface slow requests during CCOD work.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

ping.path = /fpm-ping
