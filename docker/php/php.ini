; Block Radar PHP settings.
; The CCOD file is ~3.5M rows, so the CLI needs plenty of headroom while the
; FPM request path stays conservative.

memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 512M
post_max_size = 512M

date.timezone = Europe/London

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Bind mounts in development need revalidation; the production image overrides
; this by baking the source in and can safely set validate_timestamps=0.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
